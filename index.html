<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<title>Poker chips</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="glass-bg" data-glass-bg=""></canvas>

<section id="setup">
  <h1>Poker chips</h1>
  <div id="name-fields"></div>
  <button id="add-player" data-act="add-row" type="button">Add player</button>
  <div class="settings">
    <label>Starting chips<input id="start-chips" inputmode="numeric" value="1000"></label>
    <label>Small blind<input id="sb" inputmode="numeric" value="25"></label>
    <label>Big blind<input id="bb" inputmode="numeric" value="50"></label>
  </div>
  <button id="begin" class="btn primary" data-act="start" type="button">Start game</button>
  <p id="setup-error" class="error" hidden>Add at least 2 players</p>
</section>

<section id="game" hidden>
  <header>
    <span id="hand-label"></span>
    <button class="ghost" data-act="end-game" type="button">End</button>
  </header>
  <div id="pot"><span>Pot</span><b id="pot-value"></b></div>
  <div id="players"></div>
  <div id="console"><canvas data-glass aria-hidden="true"></canvas><div class="inner"></div></div>
</section>

<script src="glass.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
